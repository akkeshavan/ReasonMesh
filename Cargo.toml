[workspace]
members = [
    "crates/rm-api",
    "crates/rm-syntax",
    "crates/rm-ir",
    "crates/rm-sat",
    "crates/rm-smt",
    "crates/rm-theory-euf",
    "crates/rm-theory-bv",
    "crates/rm-theory-arith",
    "crates/rm-akx",
    "crates/rm-bus",
    "crates/rm-scheduler",
    "crates/rm-worker",
    "crates/rm-orchestrator",
    "crates/rm-gpu",
    "crates/rm-gpu-cuda",
    "crates/rm-proof",
    "crates/rm-telemetry",
    "crates/rm-bench",
    "crates/rm-coordinator",
    "crates/rm-node",
    "crates/reasonmesh-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/reasonmesh/reasonmesh"

[workspace.dependencies]
# Internal crates — version required alongside path so crates.io can resolve
# the dependency graph after `path` is stripped on publish.
rm-api      = { path = "crates/rm-api",      version = "0.1.0" }
rm-akx      = { path = "crates/rm-akx",      version = "0.1.0" }
rm-ir       = { path = "crates/rm-ir",       version = "0.1.0" }
rm-syntax   = { path = "crates/rm-syntax",   version = "0.1.0" }
rm-sat      = { path = "crates/rm-sat",      version = "0.1.0" }
rm-smt      = { path = "crates/rm-smt",      version = "0.1.0" }
rm-theory-euf   = { path = "crates/rm-theory-euf",   version = "0.1.0" }
rm-theory-bv    = { path = "crates/rm-theory-bv",    version = "0.1.0" }
rm-theory-arith = { path = "crates/rm-theory-arith", version = "0.1.0" }
rm-bus       = { path = "crates/rm-bus",      version = "0.1.0" }
rm-scheduler = { path = "crates/rm-scheduler", version = "0.1.0" }
rm-worker    = { path = "crates/rm-worker",   version = "0.1.0" }
rm-orchestrator = { path = "crates/rm-orchestrator", version = "0.1.0" }
rm-gpu       = { path = "crates/rm-gpu",      version = "0.1.0" }
rm-proof     = { path = "crates/rm-proof",    version = "0.1.0" }
rm-telemetry = { path = "crates/rm-telemetry", version = "0.1.0" }
rm-bench     = { path = "crates/rm-bench",    version = "0.1.0" }
rm-coordinator = { path = "crates/rm-coordinator", version = "0.1.0" }
rm-node        = { path = "crates/rm-node",   version = "0.1.0" }

# External crates
crossbeam-channel = "0.5"
tokio    = { version = "1", features = ["full"] }
axum     = "0.7"
uuid     = { version = "1", features = ["v4", "serde"] }
reqwest  = { version = "0.12", features = ["json"] }
clap              = { version = "4", features = ["derive"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
thiserror         = "2"
log               = "0.4"
env_logger        = "0.11"
smallvec          = { version = "1", features = ["serde"] }
rustc-hash        = "2"
parking_lot       = "0.12"
toml              = "0.8"
postcard          = { version = "1", features = ["alloc"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.bench]
inherits = "release"
debug = true
