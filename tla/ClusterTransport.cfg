\* TLC model: 2 workers, 3 cubes, 1 SAT cube + 2 UNSAT cubes.

SPECIFICATION Spec

\* Terminal states (result=Sat/Unsat, all workers Idle, no pending cubes to assign)
\* have no enabled Next actions. This is correct protocol termination, not a bug.
CHECK_DEADLOCK FALSE

CONSTANTS
    Workers    = {w1, w2}
    Cubes      = {c1, c2, c3}
    SatCubes   = {c1}
    UnsatCubes = {c2, c3}
    NULL       = null

INVARIANTS
    TypeOK
    AssignmentConsistency
    NoDoubleAssignment
    SatSoundness
    UnsatSoundness
    SatCubeSound
    UnsatCubeSound
    ResultCorrect
    NoDeadlock

PROPERTIES
    ResultStable
    SolvedCubesStable
    EventualResult
    EventualCancellation
    ResultMatchesAnswer
    WorkersEventuallyIdle
    AssignedCubesEventuallyResolved
