\* TLC configuration for MC.tla — safety + weak liveness (Timeout enabled).
\* Run: tlc MC -config MC.cfg -workers auto

SPECIFICATION Spec

\* Constants: plug in the concrete 2-node / 3-clause model from MC.tla
CONSTANT NODES      <- Nodes_val
CONSTANT CLAUSES    <- Clauses_val
CONSTANT KEY_CLAUSES <- KeyClauses_val
CONSTANT HIGH_UTILITY <- HighUtil_val

\* Safety invariants (checked on every reachable state)
INVARIANT Safety

\* Liveness properties (checked with Fairness; Timeout is allowed to fire)
\* L1: export queue drains
PROPERTY ClausesEventuallyForwarded

\* L2: in-flight clauses arrive
PROPERTY ClausesEventuallyDelivered

\* L3: every node terminates
PROPERTY EventualTermination

\* L4: one UNSAT proof causes all nodes to terminate
PROPERTY ConvergentTermination

\* Note: L5 (KeyClausesPropagateToAll), L6 (ProofLeadsToVerdict), and
\* L7 (EventuallyAllUnsat) are NOT listed here because they are falsified
\* by Timeout (a node can time out before receiving shared clauses).
\* See MC_NoTimeout.cfg for those properties.
