\* TLC model: 2 workers, 3 cubes, MaxRetries=2, 1 SAT + 2 UNSAT cubes.

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

CONSTANTS
    Workers    = {w1, w2}
    Cubes      = {c1, c2, c3}
    SatCubes   = {c1}
    UnsatCubes = {c2, c3}
    MaxRetries = 2
    NULL       = null

INVARIANTS
    TypeOK
    AssignmentConsistency
    NoDoubleAssignment
    RetriesWithinBound
    AbandonedMeansExhausted
    SatSoundness
    UnsatSoundness
    SatCubeSound
    UnsatCubeSound
    ResultCorrect
    NoDeadlock

PROPERTIES
    ResultStable
    SolvedCubesStable
    EventualTermination
    EventualCancellation
    WorkersEventuallyIdle
    AssignedCubesEventuallyResolved
