\* TLC configuration for MC_NoTimeout.tla — strong liveness (no Timeout).
\* Run: tlc MC_NoTimeout -config MC_NoTimeout.cfg -workers auto

SPECIFICATION Spec_NT

\* Same concrete model as MC.cfg
CONSTANT NODES       <- Nodes_val
CONSTANT CLAUSES     <- Clauses_val
CONSTANT KEY_CLAUSES <- KeyClauses_val
CONSTANT HIGH_UTILITY <- HighUtil_val

\* Safety invariants (same as MC.cfg — removing Timeout must not break safety)
INVARIANT Safety

\* Strong liveness: these require no Timeout racing ahead of clause delivery.

\* L5: key clauses learned anywhere propagate everywhere
PROPERTY KeyClausesPropagateToAll

\* L6: accumulating the proof drives the node to UNSAT
PROPERTY ProofLeadsToVerdict

\* L7: the whole fleet eventually agrees on UNSAT
PROPERTY EventuallyAllUnsat

\* Weaker properties also hold (regression check)
PROPERTY ClausesEventuallyForwarded
PROPERTY ClausesEventuallyDelivered
PROPERTY EventualTermination
PROPERTY ConvergentTermination

\* L8: local import queue drains (pipeline end-to-end)
PROPERTY ClausesEventuallyImported

\* I8: once a verdict fires it never reverts (temporal safety)
PROPERTY VerdictMonotone
