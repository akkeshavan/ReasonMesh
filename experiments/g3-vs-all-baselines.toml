# G3 gate: ReasonMesh (16w selective AKX) vs Z3, CaDiCaL, and Kissat.
#
# Problem set spans all three difficulty tiers:
#   - PHP (pure resolution, highly structured UNSAT)
#   - Random 3-SAT near the phase transition (variable, benefits from sharing)
#   - Tseitin (structured, benefits from clause sharing)
#
# Run on CCX53 (32 vCPU AMD EPYC). Timeout 300s per problem.
# ReasonMesh uses 16 workers with selective AKX sharing (the best intra-node config).
# Baselines are single-threaded, which is the standard comparison point.
schema_version = 1
name = "g3-vs-all-baselines"
description = "G3: ReasonMesh 16w-selective vs Z3, CaDiCaL, Kissat on full problem set"

[solver]
workers = 16
seed = 1
deterministic = false
clause_sharing = true
export_min_utility = 0.25
import_min_utility = 0.143
max_conflicts_per_problem = 10000000
timeout_secs = 600

[output]
dir = "results/g3"
trace = false

[[baselines]]
name = "z3-1t"
binary = "z3"
args = ["-dimacs"]

[[baselines]]
name = "cadical"
binary = "cadical"
args = ["-q"]

[[baselines]]
name = "kissat"
binary = "kissat"
args = []

# ── PHP (pigeonhole principle) ────────────────────────────────────────────────
# Pure resolution — requires exponential proof size. Classic hard UNSAT.

[[problems]]
name = "php-9-8"
file = "../benchmarks/g1/php-9-8.cnf"
expect = "unsat"

[[problems]]
name = "php-10-9"
