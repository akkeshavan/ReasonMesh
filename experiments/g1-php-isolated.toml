# G1 gate (§18) baseline 2: multi-worker portfolio WITHOUT knowledge sharing.
# Isolated control against the clause-sharing portfolio (baseline 3).
schema_version = 1
name = "g1-php-isolated"
description = "G1 control: 4-worker isolated portfolio on PHP instances (pigeons > holes => UNSAT)"

[solver]
workers = 4
seed = 1
deterministic = false
clause_sharing = false
max_conflicts_per_problem = 5000000
timeout_secs = 15

[output]
dir = "results/g1/isolated"
trace = false

[[problems]]
name = "php-7-6"
file = "../benchmarks/g1/php-7-6.cnf"
expect = "unsat"

[[problems]]
name = "php-8-7"
file = "../benchmarks/g1/php-8-7.cnf"
expect = "unsat"

