schema_version = 1
name = "smtlib-ufidl-single"
description = "QF_UFIDL hard problems (single-threaded CDCL(T) baseline)"

[solver]
timeout_secs = 60
workers = 1
clause_sharing = false
parallel_problems = 4

[[baselines]]
name = "z3"
binary = "z3"
args   = []
workers = 1

