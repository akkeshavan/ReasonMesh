schema_version = 1
name = "smtlib-uflia-single"
description = "QF_UFLIA single-threaded baseline — 42 problems taking 2-55s (used to compare with smtlib-uflia-parallel)."

[solver]
timeout_secs = 120
workers = 1
clause_sharing = false
parallel_problems = 4

[[baselines]]
name = "z3"
binary = "z3"
args   = []
workers = 1

