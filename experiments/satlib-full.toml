schema_version = 1
name = "satlib-full"
description = "SATLIB: random 3-SAT (UF/UUF n=50-250, 100 each), graph coloring (flat50-200), AIM, parity, pigeon-hole. 1406 problems total."

[solver]
workers = 4
seed = 1
deterministic = false
clause_sharing = true
export_min_utility = 0.143
import_min_utility = 0.143
max_conflicts_per_problem = 5000000
timeout_secs = 60
parallel_problems = 2

[output]
dir = "results/satlib-full"
trace = false

[[baselines]]
name = "cadical-1t"
binary = "cadical"
args = ["-q"]

[[baselines]]
name = "cadical-4t"
binary = "cadical"
args = ["-q"]
workers = 4
seed_flag = "--seed"

[[baselines]]
name = "z3-1t"
binary = "z3"

