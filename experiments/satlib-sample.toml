schema_version = 1
name = "satlib-sample"
description = "SATLIB sample: 20 per UF/UUF category (n=50-250), 20 per flat GCP category, all AIM/parity/phole. 367 problems, 30s timeout."

[solver]
workers = 4
seed = 1
deterministic = false
clause_sharing = true
export_min_utility = 0.143
import_min_utility = 0.143
max_conflicts_per_problem = 5000000
timeout_secs = 30
parallel_problems = 2

[output]
dir = "results/satlib-sample"
trace = false

[[baselines]]
name = "cadical-1t"
binary = "cadical"
args = ["-q"]

[[baselines]]
name = "cadical-4t"
binary = "cadical"
args = ["-q"]
workers = 4
seed_flag = "--seed"

[[baselines]]
name = "z3-1t"
binary = "z3"

