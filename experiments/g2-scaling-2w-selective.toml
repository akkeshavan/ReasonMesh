# G2 gate: 2-worker AKX clause sharing (selective LBD filter). Main treatment.
schema_version = 1
name = "g2-scaling-2w-selective"
description = "G2 scaling: 2-worker selective clause sharing on mixed hard set"

[solver]
workers = 2
seed = 1
deterministic = false
clause_sharing = true
export_min_utility = 0.25
import_min_utility = 0.143
max_conflicts_per_problem = 10000000
timeout_secs = 60

[output]
dir = "results/g2/2w-selective"
trace = false

[[problems]]
name = "php-9-8"
file = "../benchmarks/g1/php-9-8.cnf"
expect = "unsat"

[[problems]]
name = "php-10-9"
file = "../benchmarks/g1/php-10-9.cnf"
expect = "unsat"

[[problems]]
name = "php-11-10"
file = "../benchmarks/g1/php-11-10.cnf"
expect = "unsat"

[[problems]]
name = "r3sat-238-2"
file = "../benchmarks/g2/r3sat-238-2.cnf"

[[problems]]
name = "r3sat-240-r425"
file = "../benchmarks/g2/r3sat-240-r425.cnf"
