schema_version = 1
name = "smt-sample"
description = "SMT benchmark suite: 90 problems across QF_BV, QF_UF, QF_IDL, QF_LIA. rm-sat vs Z3."

[solver]
timeout_secs = 30
parallel_problems = 4

[[baselines]]
name = "z3"
binary = "z3"
args   = []
workers = 1

