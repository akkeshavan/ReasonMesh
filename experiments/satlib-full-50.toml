schema_version = 1
name = "satlib-full-50"
description = "SATLIB full comparison: 50 per UF/UUF/flat category, all parity/phole/aim. 807 problems, 60s timeout."

[solver]
workers = 4
seed = 1
deterministic = false
clause_sharing = true
export_min_utility = 0.143
import_min_utility = 0.143
max_conflicts_per_problem = 10000000
timeout_secs = 60
parallel_problems = 4

[output]
dir = "results/satlib-full-50"
trace = false

[[baselines]]
name = "cadical-1t"
binary = "cadical"
args = ["-q"]

[[baselines]]
name = "z3-1t"
binary = "z3"

[[problems]]
name = "uf50/uf50-01"
file = "../benchmarks/satlib/uf50/uf50-01.cnf"
expect = "sat"

