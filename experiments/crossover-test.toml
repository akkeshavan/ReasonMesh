schema_version = 1
name = "crossover-test"
description = "Crossover test: RM-4w vs kissat-1t at 500 and 2000 vars, phase-transition random 3-SAT (ratio=4.267)."

[solver]
workers = 4
seed = 1
deterministic = false
clause_sharing = true
export_min_utility = 0.143
import_min_utility = 0.143
timeout_secs = 300
parallel_problems = 4

[output]
dir = "results/crossover-test"
trace = false

[[baselines]]
name = "kissat-1t"
binary = "kissat"
args = ["-q"]

[[problems]]
name = "n500/r3sat-500-001"
file = "../benchmarks/random-3sat/n500/r3sat-500-001.cnf"

